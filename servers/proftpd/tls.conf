#<IfModule mod_tls.c>
TLSEngine                               on
TLSLog              /var/log/proftpd/tls.log
TLSRSACertificateFile                   /etc/ssl/cert-data/tls-server.com-chain.crt
TLSRSACertificateKeyFile                /etc/ssl/cert-data/tls-server.com.key
TLSRequired                             on
#</IfModule>
